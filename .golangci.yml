version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errname
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - noctx
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
  disable:
    - err113

  settings:
    errcheck:
      check-type-assertions: true
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      enabled-tags:
        - diagnostic
        - performance
        - style
      settings:
        hugeParam:
          # Identity-carrying protocol values (AssignmentKey, Schema,
          # Assignment, artifact.Ref, session.Commit with its Ext slot) are
          # 80-128 bytes of string headers and are passed by value on purpose
          # so a callee cannot mutate the caller's copy. Only genuinely large
          # values are worth a pointer.
          sizeThreshold: 136
        rangeValCopy:
          sizeThreshold: 136
    gocyclo:
      min-complexity: 40
    nakedret:
      max-func-lines: 30
    gosec:
      excludes:
        - G104

  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - goconst
          - gocritic
          - unparam
          - prealloc
          - gocyclo
      # Conformance harnesses are test code compiled into non-_test files so
      # adapters can import them; they get the test exclusions.
      - path: ^(agentcore/artifact/artifacttest|agentcore/checkpoint/checkpointtest|agentcore/executor/store/storetest|agentcore/inbox/inboxtest|agentcore/process/processtest|agentcore/session/run/runtimetest|agentcore/session/sessiontest|agentcore/turn/turntest|provider/providertest)/
        linters:
          - errcheck
          - gosec
          - goconst
          - gocritic
          - unparam
          - gocyclo
          - prealloc

run:
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
