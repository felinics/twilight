version: "2"

linters:
  default: standard
  enable:
    - bodyclose
    - errcheck
    - errname
    - errorlint
    - goconst
    - gocritic
    - gocyclo
    - gosec
    - govet
    - ineffassign
    - misspell
    - nakedret
    - noctx
    - prealloc
    - staticcheck
    - unconvert
    - unparam
    - unused
    - usestdlibvars
  disable:
    - err113

  settings:
    errcheck:
      check-type-assertions: true
    goconst:
      min-len: 3
      min-occurrences: 3
    gocritic:
      # Runtime contracts intentionally use immutable value objects. Changing
      # these APIs to pointers would make the wire/value semantics inconsistent.
      enabled-tags:
        - diagnostic
        - performance
        - style
      disabled-checks:
        - hugeParam
    gocyclo:
      min-complexity: 40
    nakedret:
      max-func-lines: 30
    gosec:
      excludes:
        - G104

  exclusions:
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      - path: _test\.go
        linters:
          - errcheck
          - gosec
          - goconst
          - gocritic
          - unparam
          - prealloc
      # providertest is test infrastructure shared by the provider packages.
      - path: ^provider/providertest/
        linters:
          - errcheck
          - gosec
          - goconst
          - gocritic
          - unparam
      # Each decoder matches its own provider's wire codes; codes that happen
      # to be spelled alike in two formats are not one value.
      - path: ^internal/errorformat/
        linters:
          - goconst

run:
  timeout: 5m

issues:
  max-issues-per-linter: 0
  max-same-issues: 0
