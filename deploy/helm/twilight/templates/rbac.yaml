apiVersion: v1
kind: ServiceAccount
metadata:
  name: twilight-tool-backend
  labels:
    {{- include "twilight.labels" (dict "name" "tool-backend" "Release" .Release) | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: twilight-tool-backend
  labels:
    {{- include "twilight.labels" (dict "name" "tool-backend" "Release" .Release) | nindent 4 }}
rules:
  - apiGroups: ["extensions.agents.x-k8s.io"]
    resources: ["sandboxclaims", "sandboxwarmpools", "sandboxtemplates"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods", "services"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["pods/portforward"]
    verbs: ["create"]
  - apiGroups: ["discovery.k8s.io"]
    resources: ["endpointslices"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: twilight-tool-backend
  labels:
    {{- include "twilight.labels" (dict "name" "tool-backend" "Release" .Release) | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: twilight-tool-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: twilight-tool-backend
