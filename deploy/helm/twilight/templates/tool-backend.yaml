apiVersion: v1
kind: Service
metadata:
  name: tool-backend
  labels:
    {{- include "twilight.labels" (dict "name" "tool-backend" "Release" .Release) | nindent 4 }}
spec:
  selector:
    {{- include "twilight.selectorLabels" (dict "name" "tool-backend") | nindent 4 }}
  ports:
    - name: http
      port: 8083
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tool-backend
  labels:
    {{- include "twilight.labels" (dict "name" "tool-backend" "Release" .Release) | nindent 4 }}
spec:
  replicas: {{ .Values.services.toolBackend.replicas }}
  selector:
    matchLabels:
      {{- include "twilight.selectorLabels" (dict "name" "tool-backend") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "twilight.selectorLabels" (dict "name" "tool-backend") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 10001
      nodeSelector:
        twilight.io/role: {{ .Values.placement.backend | quote }}
      tolerations:
        - key: twilight.io/role
          operator: Equal
          value: {{ .Values.placement.backend | quote }}
          effect: NoSchedule
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -U {{ .Values.postgres.username }} -d {{ .Values.postgres.database }}; do sleep 2; done"]
      containers:
        - name: tool-backend
          image: {{ include "twilight.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["/usr/local/bin/tool-backend", "-config", "/etc/twilight/config/tool-backend.json"]
          ports:
            - name: http
              containerPort: 8083
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            {{- toYaml .Values.services.toolBackend.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/twilight/config
              readOnly: true
            - name: secrets
              mountPath: /etc/twilight/secrets
              readOnly: true
            - name: environments
              mountPath: /var/lib/twilight
      volumes:
        - name: config
          configMap:
            name: twilight-config
            items:
              - key: tool-backend.json
                path: tool-backend.json
        - name: secrets
          secret:
            secretName: {{ include "twilight.secretName" . }}
        - name: environments
          persistentVolumeClaim:
            claimName: twilight-environments
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: twilight-environments
  labels:
    {{- include "twilight.labels" (dict "name" "tool-backend" "Release" .Release) | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.workspace.storage }}
