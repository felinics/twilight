apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "twilight.labels" (dict "name" "postgres" "Release" .Release) | nindent 4 }}
spec:
  clusterIP: None
  selector:
    {{- include "twilight.selectorLabels" (dict "name" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  labels:
    {{- include "twilight.labels" (dict "name" "postgres" "Release" .Release) | nindent 4 }}
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "twilight.labels" (dict "name" "postgres" "Release" .Release) | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "twilight.selectorLabels" (dict "name" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "twilight.selectorLabels" (dict "name" "postgres") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 999
      nodeSelector:
        twilight.io/role: {{ .Values.placement.store | quote }}
      tolerations:
        - key: twilight.io/role
          operator: Equal
          value: {{ .Values.placement.store | quote }}
          effect: NoSchedule
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          imagePullPolicy: IfNotPresent
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: {{ .Values.postgres.database | quote }}
            - name: POSTGRES_USER
              value: {{ .Values.postgres.username | quote }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "twilight.secretName" . }}
                  key: {{ .Values.postgres.passwordKey }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgres.username }} -d {{ .Values.postgres.database }}"]
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U {{ .Values.postgres.username }} -d {{ .Values.postgres.database }}"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
