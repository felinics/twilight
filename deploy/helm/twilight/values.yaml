image:
  repository: twilight
  tag: dev
  pullPolicy: Never

secrets:
  # Create this Secret outside Helm. It contains postgres-password,
  # postgres-dsn and OPENAI_API_KEY.
  existingSecret: twilight-secrets

agentSandbox:
  enabled: true
  warmPool: twilight-sandbox-pool
  image: us-central1-docker.pkg.dev/k8s-staging-images/agent-sandbox/sandboxd:latest-main
  replicas: 1

postgres:
  image: postgres:18-alpine
  storage: 5Gi
  database: twilight
  username: twilight
  passwordKey: postgres-password

# Every workload role gets its own k3d agent node. The matching taint is
# applied when the cluster is created, so unrelated pods stay away too.
placement:
  owner: owner
  executor: executor
  backend: backend
  store: store
  sandbox: sandbox

services:
  owner:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
  worker:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
  modelBackend:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
  toolBackend:
    replicas: 1
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        memory: 256Mi
