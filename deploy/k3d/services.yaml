    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -U twilight -d twilight; do sleep 2; done"]
      containers:
        - name: tool-backend
