apiVersion: v1
kind: Service
metadata:
  name: owner
  labels:
    app.kubernetes.io/name: owner
    app.kubernetes.io/part-of: twilight
spec:
  selector:
    app.kubernetes.io/name: owner
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: owner
  labels:
    app.kubernetes.io/name: owner
    app.kubernetes.io/part-of: twilight
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: owner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: owner
        app.kubernetes.io/part-of: twilight
    spec:
      securityContext:
        fsGroup: 10001
      initContainers:
        - name: wait-for-postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c", "until pg_isready -h postgres -U twilight -d twilight; do sleep 2; done"]
      containers:
        - name: owner
          image: twilight:dev
          imagePullPolicy: Never
          command: ["/usr/local/bin/owner", "-config", "/etc/twilight/config/owner.json"]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          resources:
            requests:
              cpu: 25m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: config
              mountPath: /etc/twilight/config
              readOnly: true
            - name: secrets
              mountPath: /etc/twilight/secrets
              readOnly: true
            - name: pod-info
              mountPath: /etc/twilight/pod
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: twilight-config
            items:
              - key: owner.json
                path: owner.json
        - name: secrets
          secret:
            secretName: twilight-secrets
        - name: pod-info
          downwardAPI:
            items:
              - path: name
                fieldRef:
                  fieldPath: metadata.name
---
