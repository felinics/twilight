version: "2"
sql:
  - engine: "postgresql"
    schema: ["schema", "migrations"]
    queries: "queries"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_interface: false
        emit_exact_table_names: false
        emit_empty_slices: true
